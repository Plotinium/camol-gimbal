modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Plotinium/camol-gimbal/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
displayURL="https://github.com/Plotinium/camol-gimbal"
logoFile="camolgimbal_logo.png"
logoBlur=false
description='''
An addon for Camol: a tool that turns and reshapes camouflaged blocks.
Made with generative AI.
'''

[[mixins]]
config="camolgimbal.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="camol"
type="required"
versionRange="${camol_version_range}"
ordering="AFTER"
side="BOTH"
